name: zefirka_voice
description: Голосовой пульт для Зефирки
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Разрешения (микрофон) — версия 13.x совместима с Flutter 3.29+
  permission_handler: ^13.0.2
  
  # WebSocket для отправки команд на OSSM
  web_socket_channel: ^3.0.0
  
  # Путь к файлам (commands.json, log.txt)
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
