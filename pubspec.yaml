name: zefirka_voice
description: Голосовой пульт для Зефирки
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  permission_handler: ^10.4.5
  web_socket_channel: ^3.0.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

# Принудительно используем новые версии Android-плагинов,
# совместимые с Flutter 3.29+
dependency_overrides:
  permission_handler_android: ^13.0.1
