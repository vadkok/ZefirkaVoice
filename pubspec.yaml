name: zefirka_voice
description: Голосовой пульт для Зефирки
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  permission_handler: ^12.0.3
  web_socket_channel: ^3.0.0
  path_provider: ^2.1.1
  vosk_flutter_fixed: ^0.1.4
  http: ^1.2.0
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - girl.png
    - assets/commands.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#e3f2ed"
  adaptive_icon_foreground: "icon.png"
  adaptive_icon_foreground_inset: 25
