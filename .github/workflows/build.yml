name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android project structure
        run: |
          flutter create . --platforms android
          flutter pub get

      - name: Add INTERNET permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"

      - name: Add RECORD_AUDIO permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application|' "$MANIFEST"
          cat "$MANIFEST"

      - name: Add Proguard rules
        run: |
          mkdir -p android/app
          cat > android/app/proguard-rules.pro << 'EOF'
          # JNA — для работы Vosk с нативными библиотеками
          -keep class com.sun.jna.* { *; }
          -keepclassmembers class * extends com.sun.jna.* { public *; }
          -dontwarn java.awt.*
          -dontwarn com.sun.jna.*
          
          # Vosk
          -keep class org.vosk.** { *; }
          -keep class com.alphacephei.** { *; }
          EOF
          cat android/app/proguard-rules.pro

      - name: Fix compileSdk to 37
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts

      - name: Fix vosk_flutter_fixed compileSdk
        run: |
          VOSK_GRADLE="$HOME/.pub-cache/hosted/pub.dev/vosk_flutter_fixed-0.1.4/android/build.gradle"
          VOSK_GRADLE_KTS="$HOME/.pub-cache/hosted/pub.dev/vosk_flutter_fixed-0.1.4/android/build.gradle.kts"

          if [ -f "$VOSK_GRADLE" ]; then
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$VOSK_GRADLE"
            sed -i 's/compileSdk [0-9]*/compileSdk 36/g' "$VOSK_GRADLE"
          fi

          if [ -f "$VOSK_GRADLE_KTS" ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' "$VOSK_GRADLE_KTS"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zefirka-voice-apk
          path: build/app/outputs/flutter-apk/app-release.apk
