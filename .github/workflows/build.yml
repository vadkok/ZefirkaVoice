name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android project structure
        run: |
          flutter create . --platforms android
          flutter pub get

      - name: Fix compileSdk to 37
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          cat android/app/build.gradle.kts | grep compileSdk

      - name: Fix vosk_flutter_fixed compileSdk
        run: |
          VOSK_GRADLE="$HOME/.pub-cache/hosted/pub.dev/vosk_flutter_fixed-0.1.4/android/build.gradle"
          VOSK_GRADLE_KTS="$HOME/.pub-cache/hosted/pub.dev/vosk_flutter_fixed-0.1.4/android/build.gradle.kts"
          
          if [ -f "$VOSK_GRADLE" ]; then
            echo "Found Groovy: $VOSK_GRADLE"
            echo "--- Before ---"
            grep -i "compileSdk" "$VOSK_GRADLE" || echo "(no compileSdk line)"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$VOSK_GRADLE"
            sed -i 's/compileSdk [0-9]*/compileSdk 36/g' "$VOSK_GRADLE"
            echo "--- After ---"
            grep -i "compileSdk" "$VOSK_GRADLE" || echo "(no compileSdk line)"
          fi
          
          if [ -f "$VOSK_GRADLE_KTS" ]; then
            echo "Found Kotlin: $VOSK_GRADLE_KTS"
            echo "--- Before ---"
            grep -i "compileSdk" "$VOSK_GRADLE_KTS" || echo "(no compileSdk line)"
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' "$VOSK_GRADLE_KTS"
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' "$VOSK_GRADLE_KTS"
            echo "--- After ---"
            grep -i "compileSdk" "$VOSK_GRADLE_KTS" || echo "(no compileSdk line)"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zefirka-voice-apk
          path: build/app/outputs/flutter-apk/app-release.apk
