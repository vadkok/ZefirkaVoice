name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android project structure
        run: |
          flutter create . --platforms android
          flutter pub get

      - name: Fix compileSdk to 37
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          cat android/app/build.gradle.kts | grep compileSdk

      - name: Diagnostic - find vosk build files
        run: |
          echo "=== Searching for vosk build files ==="
          find ~/.pub-cache -type f -path "*vosk_flutter_fixed*/android/*" -name "build.gradle*"
          
          VOSK_GRADLE=$(find ~/.pub-cache -type f -path "*vosk_flutter_fixed*/android/*" -name "build.gradle" | head -1)
          VOSK_GRADLE_KTS=$(find ~/.pub-cache -type f -path "*vosk_flutter_fixed*/android/*" -name "build.gradle.kts" | head -1)
          
          echo "Groovy build.gradle: $VOSK_GRADLE"
          echo "Kotlin build.gradle.kts: $VOSK_GRADLE_KTS"
          
          if [ -n "$VOSK_GRADLE" ]; then
            echo "=== Content of build.gradle ==="
            cat "$VOSK_GRADLE"
          fi
          
          if [ -n "$VOSK_GRADLE_KTS" ]; then
            echo "=== Content of build.gradle.kts ==="
            cat "$VOSK_GRADLE_KTS"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zefirka-voice-apk
          path: build/app/outputs/flutter-apk/app-release.apk
